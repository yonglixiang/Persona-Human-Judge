<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persona Study · Research dashboard</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body><div class="admin-shell"><header><a class="brand" href="./">Persona Study</a><div><button id="language">English</button> <button id="logout" hidden>退出</button></div></header><main><div class="admin-heading"><div><div class="eyebrow">RESEARCH DASHBOARD</div><h1 id="title">研究数据看板</h1></div><button id="refresh" hidden>刷新数据</button></div><p id="error" class="notice" role="alert" hidden></p><section id="loginPanel"><p id="loginHint" class="muted">仅研究者可访问，请使用独立的管理员口令。</p><form id="loginForm"><label id="passwordLabel" for="password">管理员口令</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" class="primary">进入看板</button></form></section><div id="dashboard" hidden><p id="updated" class="fine" role="status"></p><section id="metrics" class="metrics" aria-label="Summary"></section><p id="method" class="method"></p><section class="dashboard-section"><h2 id="macroTitle">跨人格总体平均分</h2><p id="macroHint" class="muted"></p><div id="macro"></div></section><section class="dashboard-section"><h2 id="comparisonTitle">每个人格的平均一致性得分</h2><p id="comparisonHint" class="muted"></p><div id="comparison"></div></section><section class="dashboard-section"><h2 id="detailTitle">参与者评分明细</h2><form id="searchForm"><label id="searchLabel" for="search">按匿名参与者或会话 ID 查找</label><div class="search-controls"><input id="search" type="search" maxlength="80"><button id="searchButton">查找</button></div></form><p id="tableHint" class="fine"></p><div id="sessions"></div><div class="pagination"><button id="previous">上一页</button><span id="pageInfo" role="status"></span><button id="next">下一页</button></div><div id="detail"></div></section></div></main><footer class="foot">Persona consistency · Research dashboard</footer></div><script src="config.js"></script><script src="admin.js"></script></body></html>
